# Project metadata and tool config. Dependencies live in requirements/*.txt.
[project]
name = "flask-app"
version = "0.1.0"
description = "Flask + Tailwind CSS + Waitress behind Apache (HTTPS)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
