# Apache 2.4 reverse proxy -> Waitress (127.0.0.1:8000), HTTPS terminated here.
#
# Required modules: mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_rewrite
#   Linux (Debian/Ubuntu): a2enmod ssl proxy proxy_http headers rewrite
#   Windows (Apache Lounge): uncomment the matching LoadModule lines in httpd.conf
#
# Edit the four Define lines below, then include this file from httpd.conf
# (Windows) or copy it to /etc/apache2/sites-available/ and `a2ensite` (Linux).

Define APP_DOMAIN   example.com
Define APP_ROOT     /srv/flaskapp
# Windows example: Define APP_ROOT "C:/sites/flaskapp"
Define APP_UPSTREAM http://127.0.0.1:8000
Define SSL_DIR      /etc/ssl/flaskapp
# Windows example: Define SSL_DIR "C:/Apache24/conf/ssl"

# --- HTTP: redirect everything to HTTPS -------------------------------
<VirtualHost *:80>
    ServerName ${APP_DOMAIN}
    ServerAlias www.${APP_DOMAIN}

    # Let certbot / ACME HTTP challenges through, redirect the rest.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${APP_DOMAIN}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# --- HTTPS -------------------------------------------------------------
<VirtualHost *:443>
    ServerName ${APP_DOMAIN}
    ServerAlias www.${APP_DOMAIN}

    SSLEngine on
    SSLCertificateFile    "${SSL_DIR}/fullchain.pem"
    SSLCertificateKeyFile "${SSL_DIR}/privkey.pem"
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # Security headers (TLS-related ones belong to the TLS terminator).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always unset X-Powered-By
    ServerSignature Off

    # Upload limit; keep in sync with MAX_UPLOAD_MB in .env (bytes).
    LimitRequestBody 16777216

    # --- Static files served directly by Apache (fast, cached) ---------
    Alias /static/ "${APP_ROOT}/app/static/"
    <Directory "${APP_ROOT}/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
        # Files are versioned with ?v=<mtime> (asset_url), so cache long.
        Header set Cache-Control "public, max-age=2592000"
    </Directory>
    # Tailwind sources are not public.
    <Directory "${APP_ROOT}/app/static/src">
        Require all denied
    </Directory>

    # --- Everything else -> Waitress -------------------------------------
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyTimeout      120
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        /static/ !
    ProxyPass        /        ${APP_UPSTREAM}/ retry=0 connectiontimeout=5 timeout=120
    ProxyPassReverse /        ${APP_UPSTREAM}/

    ErrorLog  "logs/${APP_DOMAIN}-error.log"
    CustomLog "logs/${APP_DOMAIN}-access.log" combined
</VirtualHost>
